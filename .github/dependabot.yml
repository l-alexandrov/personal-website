version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types: ["minor", "patch"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
